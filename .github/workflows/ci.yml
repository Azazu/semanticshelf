# CI: strict OpenSpec validation, the workflow verifier's own suite,
# and `make check` (unit tests with the fake embedder; integration
# tests run against a pgvector service).
name: ci

on:
  push:
    branches: [main, "change/**"]
  pull_request:

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenSpec CLI (pinned)
        run: npm install -g @fission-ai/openspec@1.11.0
      - name: OpenSpec strict validation
        run: openspec validate --all --strict
      - name: Script suites (every scripts/*_test.sh)
        run: for t in scripts/*_test.sh; do sh "$t" || exit 1; done
      - name: Shell syntax
        run: for f in scripts/*.sh; do sh -n "$f"; done

  # hashFiles() is not available in a job-level `if` (steps only), so a
  # probe job checks out the tree and exports whether the app exists yet.
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.probe.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: test -f pyproject.toml && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"

  # Builds the images and pushes them nowhere: a build needs no registry login,
  # no package permission and no decision about who may pull it. What it catches
  # is what a test cannot — a dependency that does not install, a file that
  # stopped being copied, a lock file the image build refuses (`--locked`).
  # The stack itself is not run here: that needs the real model weights, which
  # is not what a pull request should pay for.
  image:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The layer cache is the Actions cache service.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build the interface image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          push: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          # The model runtime is a few hundred megabytes; without the cache
          # every run downloads it again.
          enable-cache: true
      - run: uv sync --frozen
      - run: make check
      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/app_test
        run: make migrate && make test-integration
