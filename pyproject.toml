[project]
name = "semanticshelf"
version = "0.1.0"
description = "Semantic search over images: CLIP text→image and DINOv2 image→image embeddings in PostgreSQL + pgvector, served by FastAPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
semanticshelf = "app.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# PyTorch CPU wheels. `explicit = true`: only packages pinned to this index
# through [tool.uv.sources] are ever resolved from it. The mapping below is
# inert until the change that adds the embedders declares `torch` itself.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ruff's default set (E4, E7, E9, F) plus isort, bugbear and pyupgrade.
# E501 stays off: the formatter owns line length (`make fmt-check`).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["app"]
warn_unreachable = true
# The model runtime ships type hints, but several of its entry points
# (`from_pretrained`, `eval`) are themselves untyped. Strict mode rejects a call
# into an untyped function; these two names are the boundary of our code, and
# everything the adapter hands back is annotated on our side.
untyped_calls_exclude = ["transformers", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: needs the pgvector container",
    "models: loads real model weights; on demand only, never in CI",
]
